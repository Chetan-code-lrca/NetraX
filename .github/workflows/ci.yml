name: NetraX CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt
          python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run backend tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and smoke-test the full deployment
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          docker compose up --build --detach

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/netrax-health.json; then
              break
            fi
            sleep 3
          done

          test -s /tmp/netrax-health.json
          cat /tmp/netrax-health.json
          curl --fail --silent http://127.0.0.1:8080/api/readiness
          curl --fail --silent http://127.0.0.1:8080/docs | grep -q "swagger-ui"

          # Exercise the real browser-proxy -> API -> detector path with the
          # bundled synthetic sample. This proves wiring, not detector quality.
          curl --fail --silent \
            --form "file=@frontend/public/examples/c2-behavioral-sample.csv" \
            http://127.0.0.1:8080/api/analyze > /tmp/netrax-c2.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/netrax-c2.json").read_text())
          assert result["status"] == "complete", result
          assert result["flows_processed"] == 1, result
          assert any(
              alert["threat_class"] == "C2_Beaconing"
              for alert in result["alerts"]
          ), result
          print("Synthetic C2 upload smoke test passed.")
          PY
