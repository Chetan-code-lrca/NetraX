name: NetraX CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend and telemetry contract tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Docker Compose configuration and loopback default
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config | grep -q '127.0.0.1:8080:80'
      - name: Build API and dashboard images
        run: docker compose build api dashboard
      - name: Build offline replay image
        run: docker compose --profile offline-replay build sensor-replay
      - name: Smoke-test replay CLI without network access
        run: |
          set -euo pipefail
          docker compose --profile offline-replay run --rm sensor-replay --help | grep -q -- "--input"
