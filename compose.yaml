services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NETRAX_MODEL_DIR: /models
      NETRAX_CICFLOWMETER_PATH: /usr/local/bin/cicflowmeter
    volumes:
      - ./model-artifacts:/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NETRAX_BIND_ADDRESS:-127.0.0.1}:${NETRAX_PORT:-8080}:80"
    restart: unless-stopped
