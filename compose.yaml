services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NETRAX_MODEL_DIR: /models
      NETRAX_CICFLOWMETER_PATH: /usr/local/bin/cicflowmeter
    volumes:
      - ./model-artifacts:/models:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sensor-replay:
    profiles: ["offline-replay"]
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["python", "-m", "netrax_sensor.replay_to_spool"]
    command: ["--help"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - ./captures:/captures:ro
      - ./schemas/examples/sensor-config-v1.json:/config/sensor-config-v1.json:ro
      - netrax_sensor_spool:/var/lib/netrax/spool
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  netrax_sensor_spool:
